<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Ceemark Pharmacy| Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA Manifest & Theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000080">
<link rel="icon" href="icons/icon-192.jpg">

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

<style>
:root{
  --text-color: #ffffff;
  --accent-color: #000080;
  --placeholder-color: rgba(0,0,128,0.9);
  --input-bg: rgba(255,255,255,0.15);
}
*{box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position: relative;
  background: url('image/shop.jpg') no-repeat center center fixed;
  background-size: cover;
  color: var(--text-color);
}
.marquee{
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  background: rgba(255,255,255,0.2);
  color:#fff;
  font-weight:600;
  font-size:14px;
  padding:6px 0;
  position:fixed;
  top:0;
  left:0;
  z-index:2;
}
.marquee span{display:inline-block; padding-left:100%;}
.card{
  width:100%;
  max-width:420px;
  background: transparent;  
  padding:30px;
  border-radius:18px;
  margin-top:40px;
  position: relative;
  z-index:2;
  color: var(--text-color);
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}
.logo{text-align:center;margin-bottom:20px;}
.logo h1, .logo p{color: var(--accent-color); text-shadow:0 1px 3px rgba(0,0,0,0.7);}
.logo h1{font-size:28px;margin:0;}
.logo p{font-size:15px;}
label{font-size:13px;font-weight:600;color: var(--accent-color);}
input, select{
  width:100%;
  padding:12px;
  margin:6px 0 14px;
  border-radius:10px;
  border:2px solid var(--accent-color);
  background: transparent;
  color: #e0e0ff;
}
input::placeholder, select::placeholder{
  color: var(--placeholder-color);
  font-weight:600;
}
input:focus, select:focus{
  outline:none;
  border-color: var(--accent-color);
  box-shadow:0 0 12px var(--accent-color);
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background: linear-gradient(135deg, #000080, #0000b3);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 18px var(--accent-color);
}
.toggle{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.toggle span{font-size:13px;font-weight:600;color: var(--accent-color);}
.toggle input{
  width:46px; height:24px; -webkit-appearance:none; appearance:none;
  background: rgba(255,255,255,0.3); border-radius:50px; position:relative; cursor:pointer; transition:.3s;
}
.toggle input::before{
  content:""; position:absolute; width:18px; height:18px; background:white; border-radius:50%; top:3px; left:4px; transition:.3s;
}
.toggle input:checked{background: var(--accent-color);}
.toggle input:checked::before{transform:translateX(20px);}
#error{color:#ff6b6b;text-align:center;margin-top:12px;font-size:13px;}
footer{
  position:fixed; bottom:0; left:0; width:100%;
  background: transparent;
  color: var(--accent-color);
  text-align:center; padding:6px 0;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 20px;
  z-index:2;
  text-shadow:0 1px 3px rgba(0,0,0,0.7);
}
footer .info span{color: var(--accent-color); font-weight:600;}
footer .theme-toggle{cursor:pointer;color: var(--accent-color);font-weight:600;}
</style>
</head>

<body>

<div class="marquee">
  <span>Welcome to Ceemark Pharmacy🛒 – Inventory & Sales Management System – Efficient, Reliable, and Secure – </span>
</div>

<div class="card" id="loginCard">
  <div class="logo">
    <h1>Ceemark pharmacy</h1>
    <p>Inventory & Sales Management System</p>
  </div>

  <div class="toggle">
    <span></span>
    <input type="checkbox" id="themeToggle">
  </div>

  <label>Username</label>
  <input id="name" placeholder="Enter your name">

  <label>Password</label>
  <input id="password" type="password" placeholder="Enter password">

  <label>Role</label>
  <select id="role">
    <option value="admin">Admin</option>
    <option value="staff">Staff</option>
  </select>

  <button onclick="login()">Login</button>
  <div id="error"></div>
</div>

<footer>
  <div class="info"><span>Heuristics Info Tech | 08058841004</span></div>
</footer>

<script>
gsap.from("#loginCard",{y:40,opacity:0,duration:1,ease:"power3.out"});
gsap.to(".marquee span",{x:"-100%",repeat:-1,duration:15,ease:"linear"});

const toggle=document.getElementById("themeToggle");
const root=document.documentElement;
const savedTheme=localStorage.getItem("theme")||"light";
root.setAttribute("data-theme",savedTheme);
toggle.checked=savedTheme==="dark";
toggle.addEventListener("change",()=>{
  const theme=toggle.checked?"dark":"light";
  root.setAttribute("data-theme",theme);
  localStorage.setItem("theme",theme);
  gsap.fromTo("body",{opacity:.6},{opacity:1,duration:.25});
});

function themeSwitch(){
  const isDark=root.getAttribute("data-theme")==="dark";
  root.setAttribute("data-theme",isDark?"light":"dark");
  toggle.checked=!isDark;
  localStorage.setItem("theme",isDark?"light":"dark");
}

async function login(){
  const name=document.getElementById("name").value.trim();
  const password=document.getElementById("password").value.trim();
  const error=document.getElementById("error");
  if(!name||!password){error.textContent="Please enter login details";return;}
  try{
    const res=await fetch("/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({name,password})
    });
    const data=await res.json();
    if(data.status==="success"){
      window.location.href=data.role==="admin"?"admin/dashboard.html":"staff/sales_entry.html";
    }else{
      error.textContent=data.error||"Login failed";
    }
  }catch(e){
    console.error(e);
    error.textContent="Network or server error";
  }
}

// ------------------------
// PWA Service Worker
// ------------------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('SW registered:', reg))
      .catch(err => console.error('SW registration failed:', err));
  });

  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'PRINT') window.print();
  });
}

// Optional: trigger offline printing
function printReceipt() {
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'PRINT' });
  } else {
    window.print();
  }
}
</script>

</body>
</html>
