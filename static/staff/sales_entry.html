<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Dashboard | PRO+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GSAP for animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
  --bg:#0a0f1e;
  --card:#1e2430;
  --accent:#facc15;
  --muted:#94a3b8;
  --text:#fff;
  --danger:#ef4444;
  --lowstock:#f87171;
}
body.light{
  --bg:#f8fafc;
  --card:#fff;
  --accent:#f59e0b;
  --muted:#475569;
  --text:#0f172a;
  --danger:#dc2626;
  --lowstock:#dc2626;
}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:var(--text);
  transition:all .3s;
}
header{
  padding:20px;
  text-align:center;
  background:var(--card);
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{color:var(--accent);margin:0;font-size:1.8rem;}
header p{margin:5px 0;font-size:1.1rem;color:var(--muted);}
header button{
  margin-left:10px;
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:var(--accent);
  color:#022c22;
  cursor:pointer;
  font-weight:bold;
  transition:all .2s;
}
header button:hover{opacity:.85;}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:0 20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}
.card h3{
  margin-top:0;
  color:var(--accent);
}
input,select,button{
  border-radius:8px;
  border:1px solid var(--muted);
  background:var(--bg);
  color:var(--text);
  padding:8px 10px;
  font-size:0.95rem;
}
button.primary{
  background:var(--accent);
  color:#022c22;
  border:none;
  font-weight:bold;
  cursor:pointer;
  transition:all .2s;
}
button.primary:hover{opacity:.85;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  padding:12px;
  text-align:left;
}
th{
  background:var(--bg);
  color:var(--muted);
  cursor:pointer;
}
tr{
  border-bottom:1px solid var(--muted);
}
tr.low-stock td{
  color:var(--lowstock);
  font-weight:bold;
}
tr.selected{
  background:rgba(250,204,21,0.2);
}
tr:hover{background:rgba(250,204,21,0.1);}
#toast{
  position:fixed;
  top:20px;
  right:20px;
  padding:16px 22px;
  background:var(--accent);
  color:#022c22;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
  opacity:0;
  pointer-events:none;
  transition:all .5s;
  z-index:1000;
}
input.qtyInput{
  width:70px;
}
button.saleBtn{
  padding:6px 12px;
  margin-left:6px;
}
button.cartBtn{
  margin-right:6px;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Welcome, <span id="staffName">Staff</span>! 👋</h1>
    <p>Super Premium Staff Sales Dashboard PRO+</p>
  </div>
  <div>
    <button onclick="toggleTheme()">Toggle Theme</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

  <!-- Products Table Card -->
  <div class="card">
    <h3>📦 Products & Sales</h3>
    <input type="search" id="productSearch" placeholder="Search products...">
    <table>
      <thead>
        <tr>
          <th onclick="sortTable('productTable',0)">Product ▲▼</th>
          <th onclick="sortTable('productTable',1)">Price ▲▼</th>
          <th onclick="sortTable('productTable',2)">Stock ▲▼</th>
          <th>Qty</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="productTable">
        <tr><td colspan="5" style="text-align:center;opacity:.6;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Cart Section (dynamically inserted) -->

  <!-- Recent Sales Table -->
  <div class="card">
    <h3>📋 Recent Sales</h3>
    <input type="search" id="salesSearch" placeholder="Search sales...">
    <table>
      <thead>
        <tr>
          <th onclick="sortTable('salesTable',0)">Product ▲▼</th>
          <th onclick="sortTable('salesTable',1)">Qty ▲▼</th>
          <th onclick="sortTable('salesTable',2)">SP ▲▼</th>
          <th onclick="sortTable('salesTable',3)">Time ▲▼</th>
        </tr>
      </thead>
      <tbody id="salesTable">
        <tr><td colspan="4" style="text-align:center;opacity:.6;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div id="toast"></div>

<script>
const API="/staff"; 
let products=[], salesData=[], cart=[];

// ---------- TOAST ----------
function showToast(msg,danger=false){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.background=danger?"var(--danger)":"var(--accent)";
  t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,3000);
}

// ---------- THEME ----------
function toggleTheme(){document.body.classList.toggle("light");}

// ---------- LOGOUT ----------
function logout(){
  sessionStorage.clear();
  localStorage.clear();
  location.href="/index.html";
}

// ---------- LOAD PRODUCTS ----------
async function loadProducts(){
  try{
    const res=await fetch(`${API}/products`,{credentials:"include"});
    if(!res.ok){ showToast("Session expired",true); return location.href="/index.html"; }
    products=await res.json();
    renderProducts();
  }catch(e){ console.error(e); showToast("Failed to load products",true);}
}

// ---------- RENDER PRODUCTS ----------
function renderProducts(){
  const tbody=document.getElementById("productTable");
  const filter=document.getElementById("productSearch").value.toLowerCase();
  const items=products.filter(p=>p.name.toLowerCase().includes(filter));
  tbody.innerHTML=items.length?"": `<tr><td colspan="5" style="text-align:center;opacity:.6;">No products found</td></tr>`;
  items.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${p.name}</td>
      <td>₦${p.sp}</td>
      <td>${p.quantity}</td>
      <td><input type="number" min="1" max="${p.quantity}" id="qty-${p.id}" class="qtyInput" placeholder="0"></td>
      <td><button class="primary cartBtn" onclick="addToCart(${p.id})">Add</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// ---------- CART ----------
function addToCart(product_id){
  const qtyInput=document.getElementById(`qty-${product_id}`);
  const quantity=parseInt(qtyInput.value);
  if(!quantity||quantity<=0){ showToast("Enter valid quantity",true); return;}
  const product=products.find(p=>p.id===product_id);
  if(!product){ showToast("Product not found",true); return;}
  if(quantity>product.quantity){ showToast("Not enough stock",true); return;}
  const existing=cart.find(i=>i.product_id===product_id);
  if(existing){ existing.quantity+=quantity; }
  else{ cart.push({product_id,name:product.name,sp:product.sp,quantity}); }
  qtyInput.value="";
  renderCart();
  showToast("Added to cart");
}

function renderCart(){
  let cartSection=document.getElementById("cartSection");
  if(!cartSection){
    const container=document.querySelector(".container");
    const div=document.createElement("div");
    div.className="card"; div.id="cartSection";
    div.innerHTML=`
      <h3>🛒 Cart</h3>
      <table>
        <thead><tr><th>Product</th><th>Qty</th><th>Unit ₦</th><th>Total ₦</th><th>Action</th></tr></thead>
        <tbody id="cartTable"></tbody>
      </table>
      <h3 id="grandTotal">Total: ₦0</h3>
      <button class="primary" id="checkoutBtn">Checkout & Print</button>
      <button class="primary" id="recordOnlyBtn">Record Only</button>
    `;
    container.insertBefore(div, container.children[1]);
    cartSection=div;

    // Attach button handlers
    document.getElementById("checkoutBtn").addEventListener("click", async ()=>{ await submitCart(true); });
    document.getElementById("recordOnlyBtn").addEventListener("click", async ()=>{ await submitCart(false); });
  }

  const tbody=document.getElementById("cartTable"); tbody.innerHTML="";
  let total=0;
  cart.forEach(item=>{
    const lineTotal=item.sp*item.quantity; total+=lineTotal;
    const row=document.createElement("tr");
    row.innerHTML=`
      <td>${item.name}</td>
      <td>${item.quantity}</td>
      <td>₦${item.sp}</td>
      <td>₦${lineTotal}</td>
      <td><button onclick="removeFromCart(${item.product_id})">❌</button></td>
    `;
    tbody.appendChild(row);
  });
  document.getElementById("grandTotal").innerText=`Total: ₦${total}`;
}

function removeFromCart(product_id){ cart=cart.filter(i=>i.product_id!==product_id); renderCart(); }

async function submitCart(print=true){
  if(cart.length===0){ showToast("Cart empty",true); return; }
  try{
    const res=await fetch(`${API}/sales`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"include",
      body:JSON.stringify({cart:cart.map(i=>({product_id:i.product_id,quantity:i.quantity}))})
    });
    const data=await res.json();
    if(res.ok){
      showToast(data.message);
      if(print) printReceipt(cart.map(i=>({...i,total:i.sp*i.quantity})));
      cart=[]; renderCart(); loadProducts(); loadSales();
    } else showToast(data.error,true);
  }catch(e){ console.error(e); showToast("Checkout failed",true);}
}

// ---------- PRINT RECEIPT ----------
function printReceipt(items){
  let total=0;
  const now=new Date();
  const options={weekday:'long',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'};
  const dateStr=now.toLocaleDateString(undefined,options);
  let html=`<div style="font-family:monospace;width:320px;padding:10px;">
    <div style="text-align:center;">
      <h2 style="margin:5px 0;">🛒 Ceemark pharmacy. </h2>
      <p style="margin:2px 0;font-size:12px;">📍 64, Itoki Road Orija Bus Stop, Ogun State.     </p>
      <p style="margin:2px 0;font-size:12px;">📅 ${dateStr}</p>
    </div><hr>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:1px solid #000;text-align:left;">
        <th style="padding:4px;">Product</th><th style="padding:4px;text-align:center;">Qty</th>
        <th style="padding:4px;text-align:right;">Unit ₦</th><th style="padding:4px;text-align:right;">Total ₦</th>
      </tr></thead><tbody>`;
  items.forEach((i,index)=>{ const bg=index%2===0?'#f2f2f2':'#fff'; total+=i.total;
    html+=`<tr style="background:${bg};border-bottom:1px solid #ccc;">
      <td style="padding:4px;">${i.name}</td>
      <td style="padding:4px;text-align:center;">${i.quantity}</td>
      <td style="padding:4px;text-align:right;">₦${i.sp.toLocaleString()}</td>
      <td style="padding:4px;text-align:right;">₦${i.total.toLocaleString()}</td>
    </tr>`;
  });
  html+=`</tbody></table><hr>
    <h3 style="text-align:right;margin:5px 0;">💰 Total: ₦${total.toLocaleString()}</h3>
    <p style="text-align:center;font-size:14px;margin-top:10px;">🙏 Thank you for shopping! Please come again 😊 Contact: 08131275577, 08025614486.</p></div>`;
  const printWindow=window.open("","_blank","width=400,height=600");
  printWindow.document.write(`<html><body onload="window.print();window.close();">${html}</body></html>`);
  printWindow.document.close();
}

// ---------- LOAD SALES ----------
async function loadSales(){
  try{
    const res=await fetch(`${API}/sales/history`,{credentials:"include"});
    if(!res.ok) return;
    salesData=await res.json();
    renderSales();
  }catch(e){ console.error(e);}
}

function renderSales(){
  const tbody=document.getElementById("salesTable"); tbody.innerHTML="";
  salesData.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${s.product_name}</td><td>${s.quantity}</td><td>₦${s.sp}</td><td>${new Date(s.timestamp).toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });
}

// ---------- SORT ----------
function sortTable(tableId,colIndex){
  const table=document.getElementById(tableId);
  const rows=Array.from(table.querySelectorAll("tr")).filter(r=>r.querySelectorAll("td").length);
  let asc=table.asc=!table.asc;
  rows.sort((a,b)=>{ let x=a.children[colIndex].innerText.toLowerCase(); let y=b.children[colIndex].innerText.toLowerCase(); return (x>y?1:x<y?-1:0)*(asc?1:-1); });
  rows.forEach(r=>table.appendChild(r));
}

// ---------- SEARCH FILTERS ----------
document.getElementById("productSearch").addEventListener("input",renderProducts);
document.getElementById("salesSearch").addEventListener("input",()=>{
  const filter=document.getElementById("salesSearch").value.toLowerCase();
  const tbody=document.getElementById("salesTable");
  tbody.querySelectorAll("tr").forEach(tr=>tr.style.display=tr.children[0].innerText.toLowerCase().includes(filter)?"":"none");
});

// ---------- LIVE REFRESH ----------
setInterval(()=>{ loadProducts(); loadSales(); },10000);

// ---------- INIT ----------
loadProducts();
loadSales();
</script>

</body>
</html>
