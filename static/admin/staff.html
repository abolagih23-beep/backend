<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff List | Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GSAP for animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#111827;
  --accent:#22c55e;
  --muted:#94a3b8;
  --danger:#ef4444;
  --text:#fff;
}
body.light{
  --bg:#f1f5f9;
  --card:#fff;
  --accent:#22c55e;
  --muted:#475569;
  --text:#0f172a;
  --danger:#ef4444;
}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  transition:all .3s;
  min-height:100vh;
}

/* SIDEBAR */
aside{
  width:260px;
  min-height:100vh;
  background:var(--card);
  padding:25px;
  position:fixed;
  top:0;
  left:0;
  z-index:10;
}
aside h2{
  color:var(--accent);
  margin-bottom:30px;
  font-size:22px;
}
nav a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  padding:12px 10px;
  border-radius:8px;
  margin-bottom:6px;
  transition:.2s;
}
nav a:hover{
  background:rgba(34,197,94,.15);
  color:var(--text);
}

/* MAIN */
main{
  flex:1;
  padding:30px;
  margin-left:260px;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
header h1{
  color:var(--accent);
  margin:0;
}
header .header-actions{
  display:flex;
  gap:10px;
}
header button{
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  font-weight:500;
}
header .toggle{
  background:var(--card);
  color:var(--text);
}
header .logout{
  background:var(--danger);
  color:#fff;
}

/* CARD CONTAINER */
.container{
  max-width:900px;
  margin:0 auto;
}
.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  overflow-x:auto;
}
.card h3{
  margin-top:0;
  color:var(--accent);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  padding:12px;
  text-align:left;
}
th{
  background:var(--bg);
  color:var(--muted);
  cursor:pointer;
  user-select:none;
}
tr{
  border-bottom:1px solid var(--muted);
}
tr:hover{
  background:rgba(34,197,94,0.1);
}
input[type=search]{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid var(--muted);
  width:100%;
  margin-bottom:15px;
  background:var(--bg);
  color:var(--text);
}
.role-staff{
  color:#3b82f6;
  font-weight:bold;
}
.role-admin{
  color:#facc15;
  font-weight:bold;
}

/* TOAST */
#toast{
  position:fixed;
  top:20px;
  right:20px;
  padding:16px 22px;
  background:var(--accent);
  color:#022c22;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
  opacity:0;
  pointer-events:none;
  transition:all .5s;
  z-index:1000;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside>
  <h2>Staff Panel</h2>
  <nav>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="products.html">📦 Products</a>
    <a href="sales.html">💰 Sales</a>
    <a href="record_sales.html">🧾 Record Sales</a>
    <a href="staff.html">👥 Staff</a>
    <a href="alerts.html">🚨 Alerts</a>
    <a href="reports.html">📈 Reports</a>
    <a href="settings.html">⚙ Settings</a>
  </nav>
</aside>

<!-- MAIN -->
<main>
<header>
  <h1>Staff Members</h1>
  <div class="header-actions">
    <button class="toggle" onclick="toggleTheme()">🌗 Theme</button>
    <button class="logout" onclick="logout()">🚪 Logout</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <h3>👥 Staff List</h3>
    <input type="search" id="staffSearch" placeholder="Search staff by name or role...">
    <table>
      <thead>
        <tr>
          <th onclick="sortTable('staffTable',0)">Name ▲▼</th>
          <th onclick="sortTable('staffTable',1)">Role ▲▼</th>
        </tr>
      </thead>
      <tbody id="staffTable">
        <tr><td colspan="2" style="text-align:center;opacity:.6;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
// ---------------- API ----------------
const API = `${window.location.protocol}//${window.location.host}/admin`;
let staffData = [];
let knownStaff = new Set();

// ---------------- TOAST ----------------
function showToast(msg, danger=false){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.background = danger ? "var(--danger)" : "var(--accent)";
  t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 3000);
}

// ---------------- THEME ----------------
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
if(localStorage.getItem("theme") === "light") document.body.classList.add("light");

// ---------------- LOAD STAFF ----------------
async function loadStaff(){
  try{
    const res = await fetch(`${API}/staff`, { credentials: "include" });
    if(!res.ok){ showToast("Failed to load staff", true); return; }
    staffData = await res.json();
    renderStaff();
  } catch(e){ showToast("Error loading staff", true); console.error(e); }
}

// ---------------- RENDER STAFF ----------------
function renderStaff(){
  const tbody = document.getElementById("staffTable");
  const filter = document.getElementById("staffSearch").value.toLowerCase();
  const items = staffData.filter(s => s.name.toLowerCase().includes(filter) || s.role.toLowerCase().includes(filter));
  tbody.innerHTML = items.length ? "" : `<tr><td colspan="2" style="text-align:center;opacity:.6">No staff found</td></tr>`;

  items.forEach(s=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${s.name}</td><td class="${s.role==='staff'?'role-staff':'role-admin'}">${s.role}</td>`;
    if(!knownStaff.has(s.id)){
      knownStaff.add(s.id);
      showToast(`New staff added: ${s.name} (${s.role})`);
    }
    tbody.appendChild(tr);
    gsap.from(tr,{y:20,opacity:0,duration:.5});
  });
}

// ---------------- SEARCH ----------------
document.getElementById("staffSearch").addEventListener("input", renderStaff);

// ---------------- SORT ----------------
function sortTable(tableId, colIndex){
  const table = document.getElementById(tableId);
  const rows = Array.from(table.querySelectorAll("tr")).filter(r => r.querySelectorAll("td").length);
  let asc = table.asc = !(table.asc);
  rows.sort((a,b)=>{
    let x = a.children[colIndex].innerText.toLowerCase();
    let y = b.children[colIndex].innerText.toLowerCase();
    return (x>y?1:x<y?-1:0)*(asc?1:-1);
  });
  rows.forEach(r => table.appendChild(r));
}

// ---------------- LIVE REFRESH ----------------
setInterval(loadStaff, 10000);
loadStaff();

// ---------------- LOGOUT ----------------
async function logout(){
  try{
    await fetch(`${API.replace("/admin","/auth")}/logout`, { credentials: "include" });
  } catch(e){ console.error(e); }
  window.location.href="../index.html";
}
</script>

</body>
</html>
