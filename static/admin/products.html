<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products | Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#111827;
  --accent:#22c55e;
  --muted:#94a3b8;
  --danger:#ef4444;
  --info:#38bdf8;
  --text:#fff;
}

/* LIGHT THEME */
body.light{
  --bg:#f1f5f9;
  --card:#fff;
  --accent:#22c55e;
  --muted:#475569;
  --text:#0f172a;
  --danger:#ef4444;
  --info:#0284c7;
}

*{box-sizing:border-box;font-family:Inter,system-ui}

body{
  margin:0;
  display:flex;
  background:var(--bg);
  color:var(--text);
  transition: all 0.3s;
}

/* SIDEBAR */
aside{
  width:260px;
  min-height:100vh;
  background:var(--card);
  padding:25px;
  transition: all 0.3s;
}

aside h2{
  color:var(--accent);
  margin-bottom:30px;
}

nav a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:6px;
  transition:.3s;
}

nav a:hover,
nav a.active{
  background:var(--bg);
  color:var(--text);
}

/* MAIN */
main{
  flex:1;
  padding:30px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn-primary{background:var(--accent);color:#022c22}
.btn-danger{background:var(--danger);color:#fff}
.btn-info{background:var(--info);color:#fff}

/* FORM */
.form-card{
  background:var(--card);
  padding:25px;
  border-radius:14px;
  margin-bottom:30px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

input, select{
  padding:12px;
  border-radius:8px;
  border:1px solid #94a3b8;
  background:var(--bg);
  color:var(--text);
}

input:focus, select:focus{
  outline:none;
  border-color:var(--accent);
}

/* SEARCH */
#search{
  width:100%;
  padding:10px 14px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #94a3b8;
  background:var(--bg);
  color:var(--text);
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px;
}

th{
  background:var(--bg);
  color:var(--muted);
  font-size:13px;
}

tr{
  border-bottom:1px solid #94a3b8;
}

tr:hover{
  background:var(--bg);
}

.actions button{
  margin-right:6px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside>
  <h2>Admin Panel</h2>
  <nav>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="products.html" class="active">📦 Products</a>
    <a href="sales.html">💰 Sales</a>
    <a href="staff.html">👥 Staff</a>
    <a href="record_sales.html">🧾 Record Sales</a>
    <a href="reports.html">📈 Reports</a>
    <a href="settings.html">⚙ Settings</a>
    <a href="alerts.html">🚨 Alerts</a>
  </nav>
  <br>
  <button onclick="toggleTheme()">Toggle Theme</button>
</aside>

<!-- MAIN -->
<main>

<header>
  <h1>Product Management</h1>
</header>

<!-- SEARCH -->
<input id="search" placeholder="Search products by name or category" onkeyup="filterProducts()">

<!-- ADD PRODUCT -->
<div class="form-card">
  <h3>Add / Update Product</h3>
  <div class="form-grid">
    <input id="name" placeholder="Product name">
    <input id="cp" type="number" placeholder="Cost price">
    <input id="sp" type="number" placeholder="Selling price">
    <input id="qty" type="number" placeholder="Quantity">
    <select id="category">
      <option value="">Select Category</option>
      <option>Groceries</option>
      <option>Drugs and pharmaceuticals</option>
      <option>Beverages</option>
      <option>Snacks</option>
      <option>Dairy Products</option>
      <option>Bakery</option>
      <option>Drinks</option>
      <option>Fruits</option>
      <option>Babies</option>
      <option>Rice & Grains</option>
      <option>Pasta & Noodles</option>
      <option>Cooking Oil</option>
      <option>Spices</option>
      <option>Cleaning Supplies</option>
      <option>Personal Care</option>
      <option>Electronics</option>
      <option>Kitchen Utensils</option>
      <option>Stationeries </option>
      <option>Clothing</option>
    </select>
  </div>
  <br>
  <button class="btn-primary" onclick="saveProduct()">Save Product</button>
</div>

<!-- PRODUCTS TABLE -->
<div class="table-card">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>CP</th>
        <th>SP</th>
        <th>Qty</th>
        <th>Stock Value</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>
</div>

</main>

<script>
const API = "/admin"; // relative path, ready for deployment
let editingId = null;
let productsCache = [];

// Element references
const nameInput = document.getElementById("name");
const cpInput = document.getElementById("cp");
const spInput = document.getElementById("sp");
const qtyInput = document.getElementById("qty");
const categoryInput = document.getElementById("category");
const searchInput = document.getElementById("search");

/* LOAD PRODUCTS */
async function loadProducts(){
  try {
    const res = await fetch(`${API}/products`, { credentials:"include" });
    if(res.status === 401){ location.href="../index.html"; return; }
    const data = await res.json();
    productsCache = data;
    renderTable(data);
  } catch(e){
    alert("Failed to load products. Check backend connection.");
    console.error(e);
  }
}

/* RENDER TABLE */
function renderTable(data){
  const table = document.getElementById("productTable");
  table.innerHTML = "";
  data.forEach(p=>{
    const stockValue = Number(p.sp)*Number(p.quantity);
    table.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>₦${Number(p.cp).toLocaleString()}</td>
        <td>₦${Number(p.sp).toLocaleString()}</td>
        <td>${p.quantity}</td>
        <td>₦${stockValue.toLocaleString()}</td>
        <td>${p.category}</td>
        <td class="actions">
          <button class="btn-info" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
          <button class="btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
        </td>
      </tr>`;
  });
  gsap.from("tbody tr",{opacity:0,y:20,stagger:.04});
}

/* SAVE PRODUCT */
async function saveProduct(){
  const payload = {
    name:nameInput.value.trim(),
    cp:Number(cpInput.value),
    sp:Number(spInput.value),
    quantity:Number(qtyInput.value),
    category:categoryInput.value
  };

  if(!payload.name || !payload.sp || !payload.quantity){
    alert("Fill required fields");
    return;
  }

  const url = editingId ? `${API}/products/${editingId}` : `${API}/products`;
  const method = editingId ? "PUT" : "POST";

  try {
    const res = await fetch(url,{
      method,
      headers:{ "Content-Type":"application/json" },
      credentials:"include",
      body:JSON.stringify(payload)
    });

    if(res.ok){
      alert("Saved successfully");
      editingId=null;
      nameInput.value = cpInput.value = spInput.value = qtyInput.value = "";
      categoryInput.value = "";
      loadProducts();
    } else {
      const err = await res.json();
      alert("Error: " + (err.error || res.statusText));
    }
  } catch(e){
    alert("Failed to save product. Check internet connection.");
    console.error(e);
  }
}

/* EDIT */
function editProduct(p){
  editingId=p.id;
  nameInput.value=p.name;
  cpInput.value=p.cp;
  spInput.value=p.sp;
  qtyInput.value=p.quantity;
  categoryInput.value=p.category;
}

/* DELETE */
async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  try {
    const res = await fetch(`${API}/products/${id}`,{method:"DELETE",credentials:"include"});
    if(!res.ok) alert("Failed to delete product");
    loadProducts();
  } catch(e){
    alert("Failed to delete product. Check backend connection.");
    console.error(e);
  }
}

/* SEARCH FILTER */
function filterProducts(){
  const term = searchInput.value.toLowerCase();
  const filtered = productsCache.filter(p=>
    p.name.toLowerCase().includes(term) ||
    (p.category && p.category.toLowerCase().includes(term))
  );
  renderTable(filtered);
}

/* THEME TOGGLE */
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
if(localStorage.getItem("theme")==="light") document.body.classList.add("light");

loadProducts();
</script>

</body>
</html>
